name: 问题反馈
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**不要**贴访问 token、`dsh-web.url.txt` 内容或带 token 的日志地址；涉安全问题请走 **Security → Report a vulnerability**。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 现象 + 你期望的结果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开控制台
        2. 点「开启手机访问」
        3. ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: Windows 11 24H2 / Python 3.11.9 / 控制台 v1.0.0
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: 怎么运行的
      options:
        - 源码 python dsh_gui.py
        - 打包的 exe
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志（已抹掉 token）
      render: text
    validations:
      required: false
