name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip customtkinter pillow
      - name: Syntax check
        run: python -m py_compile dsh_gui.py
      - name: Dependency import check
        run: python -c "import tkinter, customtkinter, PIL; print('deps ok')"
