name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Syntax check
        run: >
          python -m py_compile dsh_gui.py
          dshconsole/__init__.py dshconsole/addresses.py dshconsole/adopt.py
          dshconsole/config.py dshconsole/diagnostics.py dshconsole/errors.py
          dshconsole/logtail.py dshconsole/probe.py dshconsole/psrun.py
          dshconsole/resources.py dshconsole/single.py dshconsole/snapshot.py
          dshconsole/status.py dshconsole/tasks.py dshconsole/textutil.py
          dshconsole/tray.py
      - name: Dependency import check
        run: python -c "import tkinter, customtkinter, PIL, qrcode, pystray; print('deps ok')"
      # GUI 用例与两个自检都要真的窗口，所以放在依赖装好之后；自检不碰本机真实的
      # DSH 进程与端口（探测口全部注入），runner 上没有 DSH 也能跑。
      - name: GUI self-test
        run: |
          python dsh_gui.py --selftest
          python dsh_gui.py --stop-selftest
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      # 打包校验：spec 少一个 version= 参数时构建照样成功、产物照样能跑，只是「属性」里没有版本信息 ——
      # 这个步骤专门盯着这类静默失效。
      - name: Build onefile exe and check version resource
        run: |
          python -m pip install "pyinstaller>=6,<7"
          pyinstaller --noconfirm DSHConsole.spec
          $v = (Get-Item dist\DSHConsole.exe).VersionInfo
          "FileVersion=$($v.FileVersion) ProductVersion=$($v.ProductVersion) CompanyName=$($v.CompanyName) ProductName=$($v.ProductName)"
          if (-not $v.FileVersion) { throw "FileVersion 为空：version_info.txt 或 spec 里的 version= 没生效" }
          if (-not $v.ProductVersion) { throw "ProductVersion 为空" }
          if (-not $v.CompanyName) { throw "CompanyName 为空" }
          if (-not $v.ProductName) { throw "ProductName 为空" }
